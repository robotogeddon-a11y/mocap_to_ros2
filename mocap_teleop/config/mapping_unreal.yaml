# QuickMagic "Unreal 5.5" (Manny/Quinn) skeleton. Select with mapping:=unreal (default).
# Bone names from your FBX (run the Blender script without an output path to list them).
# Matching is case-insensitive and ignores prefixes, so "LeftArm" matches "mixamorig:LeftArm".
mocap_player:
  ros__parameters:
    hips_bone: pelvis
    neck_bone: neck_01
    left_shoulder_bone: upperarm_l     # bone whose head is the shoulder joint
    left_elbow_bone: lowerarm_l       # head = elbow
    left_wrist_bone: hand_l           # head = wrist
    right_shoulder_bone: upperarm_r
    right_elbow_bone: lowerarm_r
    right_wrist_bone: hand_r
    speed: 1.0                # playback speed multiplier
    loop: true
    smoothing_window: 5       # frames; 1 disables smoothing
    min_elbow_for_yaw: 0.35   # rad; below this the upper-arm twist is held
    # Mocap skeleton drawn next to the robot (topic /mocap_skeleton) for comparison.
    # Each bone links to its nearest listed ancestor. Empty list disables it.
    skeleton_bones: [pelvis, spine_03, neck_01, head,
                     clavicle_l, upperarm_l, lowerarm_l, hand_l,
                     clavicle_r, upperarm_r, lowerarm_r, hand_r,
                     thigh_l, calf_l, foot_l, ball_l,
                     thigh_r, calf_r, foot_r, ball_r]
    skeleton_offset: [0.0, 0.8, 0.0]   # metres in base_link; [0, 0, 0] overlays it on the robot
